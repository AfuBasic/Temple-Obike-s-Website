services:
  php-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-temple_obike}
      DB_USER: ${DB_USER:-temple_user}
      DB_PASS: ${DB_PASS:-secret123}
      SESSION_SECRET: ${SESSION_SECRET:-your_secure_admin_secret_here}
      SMTP_USER: ${SMTP_USER:-templescounsel@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecretpass}
      MYSQL_DATABASE: ${DB_NAME:-temple_obike}
      MYSQL_USER: ${DB_USER:-temple_user}
      MYSQL_PASSWORD: ${DB_PASS:-secret123}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
